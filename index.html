<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nachricht an Johanna</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 460px;
      margin: 40px auto;
      padding: 20px;
      background: #fff5f7;
      color: #333;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #888; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
    label { font-size: 14px; font-weight: 500; display: block; margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      background: white;
    }
    textarea { height: 120px; resize: vertical; }
    .ascii-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .ascii-option {
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 8px 4px;
      cursor: pointer;
  white-space: pre;
  text-align: left;
     
      background: white;
      transition: border-color 0.2s;
    }
    .ascii-option:hover { border-color: #e75480; }
    .ascii-option.selected { border-color: #e75480; background: #fff0f4; }
    .ascii-option pre {
      font-size: 7px;
      margin: 0;
      line-height: 1.3;
      overflow: hidden;
    }
    .ascii-option .name {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
    }
    .none-option {
      border: 2px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      background: white;
      font-size: 13px;
      color: #888;
      grid-column: span 4;
    }
    .none-option.selected { border-color: #e75480; background: #fff0f4; color: #e75480; }
    button {
      width: 100%;
      padding: 14px;
      background: #e75480;
      color: white;
      border: none;
      border-radius: 8px;
      font-size:16px;
      cursor: pointer;
    }
    button:hover { background: #d4446f; }
    #status { margin-top: 14px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Nachricht an Johanna 💌</h1>
  <p class="sub">Schreib ihr doch was Mausiges, das sie Zuhause begrüßt!</p>

  <label>Dein Name</label>
  <input type="text" id="sender" placeholder="z.B. Jürgen">

  <label>Nachricht <span id="zaehler" style="color:#888;font-weight:400">0/1000</span></label>
<textarea id="message" placeholder="Platz für deinen mausigen Text...Emojis funktionieren leider nicht :( Dafür aber old-school Smileys ;-) " maxlength="1000" oninput="zaehlen()"></textarea>

  <label>Kleines Tierchen, das nach der Nachricht gedruckt wird (optional)</label>
  <div class="ascii-grid" id="ascii-grid"></div>

  <button onclick="senden()">Absenden</button>
  <div id="status"></div>

  <script>
function zaehlen() {
  const len = document.getElementById('message').value.length;
  const zaehler = document.getElementById('zaehler');
  zaehler.textContent = len + '/1000';
  zaehler.style.color = len > 900 ? '#e75480' : '#888';
}
    const bilder = [
      { name: "Katze 1", art: `    |\\__/,|   (\`\\\n  _.|o o  |_   ) )\n-(((---(((--------` },
      { name: "Katze 2", art: `  \\    /\\\n   )  ( ')\n  (  /  )\n   \\(__)|` },
      { name: "Hase",    art: `    (\\ /)\n    ( . .)\n    c(")(")` },
      { name: "Schwein", art: `    _____\n^..^     \\9\n(oo)_____/\n   WW  WW` },
      { name: "Fuchs",   art: `|\\_/|,,_____,~~\`\n(.".)~~     )\`~}}\n \\o/\\ /---~\\\\ ~}}\n   _//    _// ~}` },
      { name: "Maus",    art: `  __QQ\n (_)_">\n_)` },
      { name: "Kuh",     art: `(__)\n(¬¬)_____\n(oo)    /|\\\n  | |--/ | *\n  w w w  w` },
      { name: "Gesicht", art: `         ,,,\n        (o o)\n----oOO--( )--OOo----` },
    ];

    let ausgewaehlt = null;

    const grid = document.getElementById('ascii-grid');

    bilder.forEach((b, i) => {
      const div = document.createElement('div');
      div.className = 'ascii-option';
      div.innerHTML = `<pre>${b.art}</pre><div class="name">${b.name}</div>`;
      div.onclick = () => {
        document.querySelectorAll('.ascii-option, .none-option').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        ausgewaehlt = b.art;
      };
      grid.appendChild(div);
    });

    const keins = document.createElement('div');
    keins.className = 'none-option selected';
    keins.textContent = 'Kein Bild';
    keins.onclick = () => {
      document.querySelectorAll('.ascii-option, .none-option').forEach(el => el.classList.remove('selected'));
      keins.classList.add('selected');
      ausgewaehlt = null;
    };
    grid.appendChild(keins);

    async function senden() {
      const sender = document.getElementById('sender').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!sender || !message) {
        document.getElementById('status').textContent = 'Bitte Name und Nachricht ausfüllen!';
        return;
      }

      const res = await fetch('https://johannas-fax-geraet.onrender.com/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender, message, ascii: ausgewaehlt, password: 'johanna123' })
      });

      const data = await res.json();
      if (data.success) {
        document.getElementById('status').textContent = 'Nachricht gesendet! 💌';
        document.getElementById('message').value = '';
        document.getElementById('sender').value = '';
        document.querySelectorAll('.ascii-option').forEach(el => el.classList.remove('selected'));
        keins.classList.add('selected');
        ausgewaehlt = null;
      } else {
        document.getElementById('status').textContent = 'Fehler: ' + data.error;
      }
    }
  </script>
</body>
</html>
